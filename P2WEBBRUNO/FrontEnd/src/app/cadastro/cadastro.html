<div class="container py-5" data-bs-theme="dark">
  <div class="row justify-content-center">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
      <div class="card border-secondary">
        
        <div class="card-body p-4">
          <h4 class="card-title text-white mb-1">Criar conta</h4>
          <p class="text-secondary mb-4">Preencha os dados abaixo para comprar na Apex.</p>
          @if (mensagem()) {
            <div class="alert alert-success">{{mensagem()}}</div>
          }
          @if (erro()) {
            <div class="alert alert-danger">{{erro()}}</div>
          }
          <form>
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Nome de usuário" [(ngModel)]="obj.nome">
              <label for="usuario">Nome de usuário</label>
            </div>

            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email" name="email" placeholder="E-mail" [(ngModel)]="obj.email">
              <label for="email">E-mail</label>
            </div>

            <div class="form-floating mb-3">
              <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="Telefone" [(ngModel)]="obj.telefone">
              <label for="telefone">Telefone</label>
            </div>

            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="documento" name="documento" placeholder="Documento" [(ngModel)]="obj.documento">
              <label for="documento">Documento</label>
            </div>

            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="logradouro" name="logradouro" placeholder="Endereço" [(ngModel)]="obj.logradouro">
              <label for="logradouro">Endereço</label>
            </div>

            <div class="form-floating mb-4">
              <input type="password" class="form-control" id="senha" name="senha" placeholder="Senha" [(ngModel)]="obj.senha">
              <label for="senha">Senha</label>
            </div>

            <button type="button" class="btn btn-danger btn-lg w-100" (click)="gravar()">Criar conta</button>
          </form>
        </div>
        <div class="card-footer text-center border-secondary">
          <span class="text-secondary">Já tem conta?</span>
          <a href="/login" class="link-danger">Entrar</a>
        </div>
      </div>
    </div>
  </div>
</div>
