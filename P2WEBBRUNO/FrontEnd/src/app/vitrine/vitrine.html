@if (erro()) {
    <div class="alert alert-danger m-3">{{ erro() }}</div>
}

<!-- container-fluid + px: afasta os produtos das bordas da tela.  g-4: espaço entre os cards. -->
<div class="container-fluid px-3 px-md-4 pb-4">
    <div class="row g-2">
        @for (obj of lista(); track obj.codigo) {
            <!-- o col-* fica numa div SÓ dele; o card vai dentro (h-100 = todos da mesma altura) -->
            <div class="col-sm-12 col-md-6 col-lg-4 col-xl-3 col-xxl-2">
                <div class="card h-100 align-items-center">
                    <img src="{{obj.codigo}}.jpg" class="card-img-top w-75" ><br>
                    <div class="card-body">
                        <label class="card-title">{{obj.nome}}</label><br>
                        @if (obj.valorPromo > 0) {
                            <span class="text-decoration-line-through text-secondary">R$ {{obj.valor.toFixed(2).replace('.', ',')}}</span><br>
                            R$ {{obj.valorPromo.toFixed(2).replace('.', ',')}}<br>
                        } @else {
                            R$ {{obj.valor.toFixed(2).replace('.', ',')}}<br>
                        }
                        <a routerLink="/detalhe" [queryParams]="{codigo: obj.codigo}" class="btn btn-outline-light">Detalhe</a>
                        @if (obj.quantidade > 0) {
                            <button class="btn btn-outline-danger" (click)="adicionarItem(obj)">Comprar</button>
                        }
                    </div>
                </div>
            </div>
        }
    </div>
</div>
