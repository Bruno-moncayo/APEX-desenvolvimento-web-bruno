<div class="container py-5" data-bs-theme="dark">
  <div class="row justify-content-center">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">

      <div class="card border-secondary">
        <div class="card-body p-4">
          <h4 class="card-title text-white mb-1">Entrar</h4>
          <p class="text-secondary mb-4">Acesse sua conta.</p>

          @if (mensagem()) {
            <div class="alert alert-danger">{{mensagem()}}</div>
          }

          <form>
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email" name="email" placeholder="E-mail" [(ngModel)]="obj.email">
              <label for="email">E-mail</label>
            </div>

            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="senha" name="senha" placeholder="Senha" [(ngModel)]="obj.senha" (keyup.enter)="fazerLogin()">
              <label for="senha">Senha</label>
            </div>

            <button type="button" class="btn btn-danger btn-lg w-100" (click)="fazerLogin()">Entrar</button>
          </form>
        </div>
        <div class="card-footer text-center">
            Esqueceu a senha?
            <a href="reenvio" class="link-danger">Recuperar senha</a>

            <br>
            Ainda não tem conta?
            <a href="/cadastro" class="link-danger">Cadastre-se</a>
        </div>
      </div>
    </div>
  </div>
</div>
